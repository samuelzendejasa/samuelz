<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 4 - Cotizador con Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Esto quita el borde azul y el resplandor al hacer clic en los selects o inputs */
    .form-select:focus, .form-control:focus {
      border-color: #dee2e6;
      box-shadow: none;
    }
  </style>
</head>
<body class="container my-4">

  <h2>sueldos</h2>
  
  <div class="table-responsive my-3">
    <table class="table table-bordered table-striped text-center">
      <thead class="table-dark">
        <tr>
          <th>Puesto</th>
          <th>Newbie</th>
          <th>Jr</th>
          <th>Sr</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Diseñador</td>
          <td>$120</td>
          <td>$180</td>
          <td>$250</td>
        </tr>
        <tr>
          <td>Programador</td>
          <td>$120</td>
          <td>$240</td>
          <td>$310</td>
        </tr>
        <tr>
          <td>Líder</td>
          <td>$190</td>
          <td>$520</td>
          <td>$890</td>
        </tr>
      </tbody>
    </table>
  </div>

  <form class="row g-3">
    <article class="col-md-4">
      <label for="puesto" class="form-label">Puesto:</label>
      <select id="puesto" class="form-select" onchange="calcular()">
        <option value=""> Seleccionar </option>
        <option value="Diseñador">Diseñador</option>
        <option value="Programador">Programador</option>
        <option value="Lider">Líder</option>
      </select>
    </article>

    <article class="col-md-4">
      <label for="nivel" class="form-label">Nivel:</label>
      <select id="nivel" class="form-select" onchange="calcular()">
        <option value=""> Seleccionar </option>
        <option value="Newbie">Newbie</option>
        <option value="Jr">Jr</option>
        <option value="Sr">Sr</option>
      </select>
    </article>

    <article class="col-md-4">
      <label for="hrs" class="form-label">Hrs:</label>
      <input type="number" id="hrs" class="form-control" onchange="calcular()">
    </article>

    <article class="col-12">
      <label for="total" class="form-label">Total:</label>
      <input type="text" id="total" class="form-control" readonly>
    </article>
  </form>


  <script src="sueldos.js"></script>
</body>
</html>
