<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="discco.css">
</head>
<body>
    <main class="maqueta">
        <header>
            <h1>DISCO</h1>
        </header>
        <section class="cuerpo">
            <aside>
                <h2>Menú</h2>
                <nav>
                    <ul>
                        <li><a href="index.html">01 - Home</a></li>
                        <li><a href="disco.html" class="active">02 - Disco</a></li>
                        <li><a href="cantante.html">03 - Cantante</a></li>
                        <li><a href="cancion.html">04 - Canción</a></li>
                        <li><a href="playlist.html">05 - Playlist</a></li>
                    </ul>
                </nav>
            </aside>
            <article class="contenido-principal">
                <form id="form-disco">
                    <fieldset>
                        <div class="campo">
                            <span>Nombre</span>
                            <input type="text" id="disco-nombre" placeholder="Ej. Master of Puppets" required>
                        </div>
                        <div class="campo">
                            <span>Subgénero</span>
                            <input type="text" id="disco-genero" placeholder="Ej. Thrash Metal" required>
                        </div>
                        <div class="campo">
                            <span>Artista</span>
                            <select id="disco-artista">
                                <option>Metallica</option>
                                <option>AC/DC</option>
                                <option>Iron Maiden</option>
                            </select>
                        </div>
                        <div class="campo">
                            <span>Precio</span>
                            <input type="number" id="disco-precio" placeholder="250" required>
                        </div>
                        <div class="campo">
                            <span>Portada</span>
                            <input type="file" id="disco-foto">
                        </div>
                        <button type="submit" class="btn-registrar">Registrar</button>
                    </fieldset>
                </form>
                <div class="contenedor-imagen-abajo">
                    <div class="caja-subir-imagen"></div>
                </div>
            </article>
        </section>
        <footer>
            <span>grupo:401</span>
            <span>alumno:samuel</span>
        </footer>
    </main>
    <script src="app.js"></script>
</body>
</html>
